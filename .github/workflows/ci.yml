name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # Build tidak memerlukan IDLIX-API hidup: kalau API tidak terjangkau,
        # halaman beranda otomatis memakai mode contoh (lihat lib/mock.ts).
        run: npm run build
        env:
          IDLIX_API_URL: http://127.0.0.1:59999/api
          SITE_URL: http://localhost:4001
